name: runtime-pilot-ci

on:
  push:
    branches:
      - runtime/procedural-film-mcp-pilot
  workflow_dispatch:

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax check
        run: |
          node --check runtime/mcp/server.mjs
          node --check runtime/worker/worker.mjs

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $files = @(
            'runtime/scripts/START-PROCEDURAL-FILM-RUNTIME.ps1',
            'runtime/scripts/STOP-PROCEDURAL-FILM-RUNTIME.ps1',
            'runtime/scripts/PROVISION-PROCEDURAL-FILM-TUNNEL.ps1',
            'runtime/scripts/START-PROCEDURAL-FILM-TUNNEL.ps1',
            'runtime/scripts/STOP-PROCEDURAL-FILM-TUNNEL.ps1'
          )
          $hadErrors = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $hadErrors = $true
              Write-Host "Syntax errors in $file"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }
          if ($hadErrors) { exit 1 }

      - name: Install MCP dependencies
        working-directory: runtime/mcp
        run: npm install --no-audit --no-fund

      - name: Verify MCP v2 imports
        working-directory: runtime/mcp
        run: |
          node --input-type=module -e "import {McpServer,createMcpHandler} from '@modelcontextprotocol/server'; import {toNodeHandler} from '@modelcontextprotocol/node'; if(!McpServer||!createMcpHandler||!toNodeHandler) process.exit(1); console.log('MCP_IMPORTS_OK')"

      - name: Compose config validation
        working-directory: runtime
        run: docker compose config --quiet
